name: MONEYBOT giro orario

on:
  schedule:
    - cron: "7,37 * * * *"   # due volte all'ora (minuti 7 e 37, UTC), di riserva all'orologio
  workflow_dispatch:        # pulsante "Run workflow" per lanciarlo a mano

permissions:
  contents: write
  actions: write

concurrency:
  group: moneybot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Sempre l'ultima versione di main: un giro rimasto in coda non deve lavorare su dati vecchi.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Un giro del bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MONEYBOT_MODEL: ${{ vars.MONEYBOT_MODEL }}
        run: python -m moneybot run

      - name: Salva stato e report nel repository
        run: |
          git config user.name "moneybot"
          git config user.email "moneybot@users.noreply.github.com"
          git add state REPORT.md
          git diff --cached --quiet && exit 0
          git commit -m "giro del bot $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push

      - name: Pubblica la web app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish_site.sh

      - name: Rimetti in moto l'orologio se si è fermato
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow orologio.yml --limit 5 --json status \
            --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = "0" ]; then
            echo "Orologio fermo: lo riavvio"
            gh workflow run orologio.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
