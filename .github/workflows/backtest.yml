name: Backtest settimanale

on:
  schedule:
    - cron: "41 3 * * 0"   # ogni domenica alle 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moneybot
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: klines-${{ github.run_id }}
          restore-keys: klines-
      - name: Backtest su 2 anni
        run: python -m moneybot backtest
      - name: Backtest multi-mercato su 20 anni
        run: python -m moneybot multi-backtest
      - name: Salva i risultati
        run: |
          git config user.name "moneybot"
          git config user.email "moneybot@users.noreply.github.com"
          git add state/dashboard/backtest.json state/dashboard/multi_backtest.json
          git diff --cached --quiet && exit 0
          git commit -m "backtest settimanale $(date -u '+%Y-%m-%d')"
          git pull --rebase
          git push
      - name: Pubblica la web app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/publish_site.sh
